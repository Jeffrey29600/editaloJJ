<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hola Mundo</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: Arial, sans-serif;
      background: #0f172a;
    }

    .card {
      text-align: center;
      padding: 60px 80px;
      border-radius: 24px;
      background: white;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
    }

    h1 {
      font-size: 64px;
      color: #22a447;
      margin-bottom: 15px;
    }

    p {
      font-size: 20px;
      color: #64748b;
    }

    .dot {
      width: 12px;
      height: 12px;
      background: #22a447;
      border-radius: 50%;
      display: inline-block;
      margin-right: 8px;
      animation: pulse 1.5s infinite;
    }

    @keyframes pulse {
      0%, 100% {
        transform: scale(1);
        opacity: 1;
      }

      50% {
        transform: scale(1.5);
        opacity: 0.5;
      }
    }

    @media (max-width: 600px) {
      .card {
        margin: 20px;
        padding: 45px 30px;
      }

      h1 {
        font-size: 42px;
      }
    }
  </style>
</head>

<body>

  <div class="card">
    <h1>Hola mundo</h1>
    <p>
      <span class="dot"></span>
      Mi primera página web
    </p>
  </div>

</body>
</html>
